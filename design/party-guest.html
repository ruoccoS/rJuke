<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0c1a10">
<title>__TITLE__</title>
<style>
:root { --acc: #a2f7a1; --acc2: #2fbf71; --bg: #0b0f0c; --card: rgba(255,255,255,.07); --line: rgba(255,255,255,.09); --t2: rgba(255,255,255,.62); --t3: rgba(255,255,255,.42); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: #fff; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overflow-x: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; }
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg img { position: absolute; inset: -20%; width: 140%; height: 140%; object-fit: cover; filter: blur(60px) saturate(1.6) brightness(.55); opacity: 0; transition: opacity 1.2s ease; animation: drift 24s ease-in-out infinite alternate; }
.bg img.in { opacity: 1; }
.bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 0%, transparent, rgba(11,15,12,.75) 60%, #0b0f0c 92%); }
.bg .glow { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(80px); opacity: .35; }
.bg .g1 { background: #2fbf71; left: -30vmax; top: -30vmax; animation: float1 18s ease-in-out infinite alternate; }
.bg .g2 { background: #0f6b5c; right: -35vmax; top: 10vh; animation: float2 22s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(3%, -2%) scale(1.08) rotate(3deg); } }
@keyframes float1 { to { transform: translate(18vmax, 12vmax); } }
@keyframes float2 { to { transform: translate(-14vmax, 18vmax); } }
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 12px; padding: 4px 2px 14px; animation: rise .7s cubic-bezier(.2,1,.3,1) both; }
.logo { width: 42px; height: 42px; border-radius: 13px; background: linear-gradient(145deg, #a2f7a1, #2fbf71); display: grid; place-items: center; box-shadow: 0 8px 26px rgba(70,200,100,.4); flex: none; animation: beat 2.4s ease-in-out infinite; }
.logo svg { width: 24px; height: 24px; }
@keyframes beat { 50% { transform: scale(1.06); box-shadow: 0 8px 36px rgba(70,200,100,.6); } }
header h1 { font-size: 19px; margin: 0; letter-spacing: -.02em; line-height: 1.15; }
header .sub { font-size: 12.5px; color: var(--t2); margin-top: 2px; }
header > div:nth-child(2) { min-width: 0; }
header .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 360px) { header { gap: 9px; } header > .logo { width: 38px; height: 38px; border-radius: 12px; } .me { padding: 6px 9px; } }
.me { flex: none; margin-left: auto; font-size: 12.5px; padding: 6px 11px; border-radius: 99px; background: var(--card); color: var(--t2); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }

.now { position: relative; border-radius: 22px; padding: 16px; background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03)); border: 1px solid var(--line); display: flex; gap: 14px; align-items: center; animation: rise .8s cubic-bezier(.2,1,.3,1) .06s both; overflow: hidden; }
.now .cv { width: 92px; height: 92px; border-radius: 12px; flex: none; overflow: hidden; background: #1c2a20; box-shadow: 0 14px 34px rgba(0,0,0,.45); transition: transform .6s cubic-bezier(.2,1.3,.3,1); }
.now.paused .cv { transform: scale(.9); }
.now .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.now .cv.swap { animation: pop .7s cubic-bezier(.2,1.3,.3,1); }
@keyframes pop { from { transform: scale(.6) rotate(-6deg); opacity: 0; } }
.now .info { min-width: 0; flex: 1; }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); display: flex; align-items: center; gap: 7px; }
.eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 11px; }
.eq i { width: 3px; background: var(--acc); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
.paused .eq i { animation: none; height: 3px; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 11px; } }
.now .tt { font-size: 18px; font-weight: 700; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.now .ta { color: var(--t2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.by { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 12px; font-weight: 600; padding: 3px 9px 3px 4px; border-radius: 99px; background: rgba(162,247,161,.14); color: var(--acc); }
.by i { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 10px; background: var(--acc); color: #0b1f10; font-weight: 800; }
.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); margin-top: 10px; overflow: hidden; }
.bar b { display: block; height: 100%; background: #fff; border-radius: 2px; transform-origin: 0 50%; transform: scaleX(0); }
.idle { text-align: center; color: var(--t2); padding: 18px 6px; width: 100%; }

.mine { display: flex; gap: 8px; overflow-x: auto; padding: 14px 2px 2px; scrollbar-width: none; }
.mine::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; max-width: 250px; transition: background .4s, border-color .4s; }
.chip.new { animation: rise .5s cubic-bezier(.2,1,.3,1) both; }
.chip em { transition: background .4s, color .4s; }
.quiet .row, .quiet .alb { animation: none; }
.chip img, .chip .ph { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: none; background: #26372b; }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip em { font-style: normal; font-weight: 700; font-size: 11px; padding: 2px 7px; border-radius: 99px; flex: none; }
.s-pending em { background: rgba(255,200,90,.18); color: #ffd17a; }
.s-queued em { background: rgba(162,247,161,.16); color: var(--acc); }
.s-playing em { background: var(--acc); color: #0b1f10; }
.s-played em { background: rgba(255,255,255,.1); color: var(--t3); }
.s-rejected em { background: rgba(255,90,90,.16); color: #ff8a8a; }

.search { position: sticky; top: 0; z-index: 5; margin: 16px -16px 0; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: linear-gradient(to bottom, rgba(11,15,12,.96) 70%, rgba(11,15,12,0)); }
.sbox { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: rgba(255,255,255,.1); border: 1px solid var(--line); transition: background .2s, border-color .2s, box-shadow .2s; }
.sbox:focus-within { background: rgba(255,255,255,.14); border-color: rgba(162,247,161,.5); box-shadow: 0 0 0 4px rgba(162,247,161,.12); }
.sbox svg { width: 18px; height: 18px; opacity: .6; flex: none; }
.sbox input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #fff; font-size: 16px; }
.sbox input::placeholder { color: var(--t3); }
.tabs { display: flex; gap: 6px; margin-top: 10px; }
.tab { padding: 7px 14px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--t2); background: var(--card); transition: background .25s, color .25s; }
.tab.on { background: #fff; color: #0b0f0c; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); margin: 18px 4px 6px; }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 12px; animation: rise .45s cubic-bezier(.2,1,.3,1) both; }
.row:active { background: rgba(255,255,255,.06); }
.row .cv { width: 48px; height: 48px; border-radius: 8px; flex: none; overflow: hidden; background: #1f2d23; }
.row .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row .tx { flex: 1; min-width: 0; }
.row .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ta { font-size: 13px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ta b { color: var(--acc); font-weight: 600; }
.row .n { width: 22px; text-align: center; color: var(--t3); font-size: 13px; flex: none; }
.add { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; background: rgba(162,247,161,.16); color: var(--acc); transition: transform .2s, background .25s, color .25s; }
.add:active { transform: scale(.85); }
.add svg { width: 20px; height: 20px; transition: transform .35s cubic-bezier(.2,1.4,.3,1); }
.add.done { background: var(--acc); color: #0b1f10; }
.add.done svg { transform: rotate(360deg); }
.add.wait { opacity: .5; pointer-events: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding-top: 6px; }
.alb { text-align: left; animation: rise .5s cubic-bezier(.2,1,.3,1) both; }
.alb .cv { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #1f2d23; box-shadow: 0 10px 26px rgba(0,0,0,.35); transition: transform .25s; }
.alb:active .cv { transform: scale(.95); }
.alb .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.alb .tt { font-weight: 600; font-size: 14px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alb .ta { font-size: 12.5px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ahead { display: flex; gap: 14px; align-items: flex-end; margin: 10px 2px 8px; animation: rise .5s cubic-bezier(.2,1,.3,1) both; }
.ahead .cv { width: 120px; height: 120px; border-radius: 12px; overflow: hidden; flex: none; background: #1f2d23; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
.ahead .cv img { width: 100%; height: 100%; object-fit: cover; }
.ahead h3 { margin: 0; font-size: 20px; letter-spacing: -.02em; line-height: 1.15; }
.ahead p { margin: 4px 0 0; color: var(--t2); font-size: 14px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--acc); font-weight: 600; margin: 14px 2px 0; }
.back svg { width: 18px; height: 18px; }
.empty { text-align: center; color: var(--t2); padding: 34px 20px; }
.empty b { display: block; color: #fff; font-size: 16px; margin-bottom: 4px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 30; transform: translate(-50%, 30px); opacity: 0; padding: 12px 18px; border-radius: 16px; background: rgba(30,40,33,.96); border: 1px solid var(--line); box-shadow: 0 14px 40px rgba(0,0,0,.5); font-weight: 600; font-size: 14px; max-width: calc(100vw - 32px); text-align: center; transition: transform .45s cubic-bezier(.2,1.3,.3,1), opacity .3s; pointer-events: none; }
.toast.in { transform: translate(-50%, 0); opacity: 1; }
.toast.ok { background: linear-gradient(135deg, #a2f7a1, #2fbf71); color: #0b1f10; border: 0; }

.gate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; background: rgba(8,12,9,.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); animation: fade .4s ease both; }
@keyframes fade { from { opacity: 0; } }
.gate .card { width: min(380px, 100%); text-align: center; animation: rise .7s cubic-bezier(.2,1,.3,1) .1s both; }
.gate .logo { width: 74px; height: 74px; border-radius: 22px; margin: 0 auto 18px; }
.gate .logo svg { width: 40px; height: 40px; }
.gate h2 { all: unset; display: block; font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.gate h2 span { color: var(--acc); }
.gate p { color: var(--t2); margin: 10px 0 22px; }
.gate input { width: 100%; height: 52px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.1); color: #fff; font-size: 17px; text-align: center; outline: 0; }
.gate input:focus { border-color: rgba(162,247,161,.6); box-shadow: 0 0 0 4px rgba(162,247,161,.14); }
.cta { width: 100%; height: 52px; border-radius: 15px; margin-top: 12px; background: linear-gradient(135deg, #a2f7a1, #2fbf71); color: #0b1f10; font-weight: 800; font-size: 16px; box-shadow: 0 12px 30px rgba(70,200,100,.35); transition: transform .15s; }
.cta:active { transform: scale(.97); }
.out { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--card); color: var(--t2); transition: background .2s, color .2s; }
.out:active { background: rgba(255,255,255,.16); color: #fff; }
.out svg { width: 18px; height: 18px; }
.ghost { width: 100%; height: 48px; border-radius: 15px; margin-top: 10px; background: rgba(255,255,255,.08); border: 1px solid var(--line); color: #fff; font-weight: 700; font-size: 15px; }
.ghost:active { background: rgba(255,255,255,.14); }
.confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
</style>
</head>
<body>
<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><img id="bgimg" alt=""></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var CFG = __CFG__;
  // the page follows the language of the host app (the messages it sends are in that language too)
  var IT = CFG.lang === 'it';
  var L = function (en, it) { return IT ? it : en; };
  var K = new URLSearchParams(location.search).get('k') || '';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var BOLT = '<svg viewBox="0 0 24 24"><path fill="#0b1f10" d="M13.2 2.6 5.6 13.1c-.4.5 0 1.2.6 1.2h4.6l-1.3 6.6c-.1.7.8 1.1 1.2.5l7.6-10.5c.4-.5 0-1.2-.6-1.2h-4.6l1.3-6.6c.1-.7-.8-1.1-1.2-.5z"/></svg>';
  var PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  var SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>';
  var EXIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5H7.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H14"/><path d="M11 12h9M16.5 8.5 20 12l-3.5 3.5"/></svg>';
  var BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>';
  var ST = { pending: L('Waiting', 'In attesa'), queued: L('Queued', 'In coda'), playing: L('Playing now!', 'Suona ora!'), played: L('Played', 'Suonato'), rejected: L('Declined', 'Rifiutato') };

  if (CFG.ended) {
    document.title = L('PartyBox ended', 'PartyBox finito');
    $('#app').innerHTML = '<div class="gate"><div class="card"><div class="logo">' + BOLT + '</div>' + L('<h2>The party is <span>over</span></h2><p>This PartyBox is no longer active. If the party is still going, ask to scan the QR code again.</p>', '<h2>La festa è <span>finita</span></h2><p>Questo PartyBox non è più attivo. Se è ancora in corso, chiedi di farti inquadrare di nuovo il QR code.</p>') + '</div></div>';
    return;
  }

  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { /* */ } } };
  var C = store.get('rj-party-c');
  if (!C) { C = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('rj-party-c', C); }
  var NAME = store.get('rj-party-name') || '';
  var st = null, at = 0, view = 'next', query = '', results = null, albums = null, album = null, curKey = '', requested = {};

  function api(path, body) {
    var url = '/party/api/' + path + (path.indexOf('?') >= 0 ? '&' : '?') + 'k=' + encodeURIComponent(K) + '&c=' + encodeURIComponent(C);
    return fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
      .then(function (r) { if (r.status === 410) { location.reload(); throw new Error('end'); } return r.json(); });
  }
  var coverUrl = function (key, size) { return key ? '/party/api/cover?k=' + encodeURIComponent(K) + '&a=' + encodeURIComponent(key) + (size ? '&size=' + size : '') : ''; };
  var hue = function (s) { var x = 0; s = String(s || ''); for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x % 360; };
  var ph = function (s) { var h1 = hue(s); return 'background:linear-gradient(135deg,hsl(' + h1 + ' 50% 55%),hsl(' + ((h1 + 40) % 360) + ' 45% 32%))'; };
  var cv = function (key, seed) { return key ? '<img src="' + coverUrl(key) + '" loading="lazy" alt="">' : '<div style="width:100%;height:100%;' + ph(seed) + '"></div>'; };
  var fmt = function (s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  var tt = 0;
  function toast(msg, ok) {
    var t = $('#toast'); t.textContent = msg; t.className = 'toast in' + (ok ? ' ok' : '');
    clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast' + (ok ? ' ok' : ''); }, 2600);
  }
  function confetti() {
    var c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
    var dpr = Math.min(2, window.devicePixelRatio || 1); c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    var x = c.getContext('2d'); x.scale(dpr, dpr);
    var cols = ['#a2f7a1', '#2fbf71', '#ffffff', '#ffd17a', '#7ad7ff'];
    var P = []; for (var i = 0; i < 90; i++) P.push({ x: innerWidth / 2, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 11 - 3, r: Math.random() * 6 + 3, c: cols[i % cols.length], a: Math.random() * 6 });
    var t0 = performance.now();
    (function f(t) {
      var k = (t - t0) / 1000; x.clearRect(0, 0, innerWidth, innerHeight);
      P.forEach(function (p) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += 0.1; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - k / 2.2); x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
      if (k < 2.3) requestAnimationFrame(f); else c.remove();
    })(t0);
  }

  // ---------- name ----------
  function gate() {
    var g = document.createElement('div'); g.className = 'gate';
    g.innerHTML = '<div class="card"><div class="logo">' + BOLT + '</div><h2>' + L('Welcome to', 'Benvenuto al') + ' <span>' + esc(CFG.title) + '</span> 🎉</h2><p>' + L('Pick the tracks you want to hear: they\'ll join the party music.', 'Scegli i brani che vuoi ascoltare: finiranno nella musica della festa.') + '</p><input id="nm" maxlength="24" placeholder="' + L('What\'s your name?', 'Come ti chiami?') + '" autocomplete="given-name" value="' + esc(NAME) + '"><button class="cta" id="go">' + L('Join the party', 'Entra nella festa') + '</button></div>';
    document.body.appendChild(g);
    var inp = $('#nm', g);
    var go = function () { var v = inp.value.trim(); if (!v) { inp.focus(); return; } NAME = v.slice(0, 24); store.set('rj-party-name', NAME); hello().then(function () { g.style.transition = 'opacity .35s'; g.style.opacity = 0; setTimeout(function () { g.remove(); }, 350); confetti(); }); };
    $('#go', g).onclick = go;
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    setTimeout(function () { inp.focus(); }, 300);
  }
  function hello() { return api('hello', { c: C, name: NAME }).then(function (r) { if (r.kicked) kicked(); render(); poll(); }).catch(function () {}); }
  // ---------- leaving ----------
  var LEFT_KEY = 'rj-party-left';
  function askLeave() {
    var g = document.createElement('div'); g.className = 'gate';
    g.innerHTML = '<div class="card"><div class="logo">' + BOLT + '</div><h2>' + L('Leave', 'Vuoi uscire dal') + ' <span>' + esc(CFG.title) + '</span>?</h2><p>' + L('Requests not yet approved will be cancelled. The ones already queued will still play.', 'Le richieste non ancora approvate verranno annullate. Quelle già in coda suoneranno lo stesso.') + '</p><button class="cta" id="lv">' + L('Leave the party', 'Esci dalla festa') + '</button><button class="ghost" id="st">' + L('Stay', 'Resta') + '</button></div>';
    document.body.appendChild(g);
    var close = function () { g.style.transition = 'opacity .25s'; g.style.opacity = 0; setTimeout(function () { g.remove(); }, 250); };
    $('#st', g).onclick = close;
    g.addEventListener('click', function (e) { if (e.target === g) close(); });
    $('#lv', g).onclick = function () {
      this.disabled = true;
      api('leave', { c: C }).catch(function () {}).then(function () { store.set(LEFT_KEY, K); g.remove(); left(); });
    };
  }
  function left() {
    clearTimeout(pt); st = null; curKey = ''; nextSig = null; requested = {};
    var bg = $('#bgimg'); if (bg) bg.classList.remove('in');
    $('#app').innerHTML = '<div class="gate"><div class="card"><div class="logo">' + BOLT + '</div>' + L('<h2>You left the <span>party</span></h2><p>Thanks for the music! You can come back whenever you like, as long as the PartyBox is on.</p>', '<h2>Sei uscito dalla <span>festa</span></h2><p>Grazie per la musica! Puoi rientrare quando vuoi, finché il PartyBox è attivo.</p>') + '<button class="cta" id="back">' + L('Rejoin the party', 'Rientra nella festa') + '</button></div></div>';
    $('#back').onclick = function () { store.set(LEFT_KEY, ''); $('#app').innerHTML = ''; if (NAME) hello(); else { render(); gate(); } };
  }
  function kicked() { $('#app').innerHTML = '<div class="gate"><div class="card"><div class="logo">' + BOLT + '</div>' + L('<h2>You\'ve been <span>removed</span></h2><p>The person in charge of the music removed you from the PartyBox.</p>', '<h2>Sei stato <span>rimosso</span></h2><p>Chi gestisce la musica ti ha tolto dal PartyBox.</p>') + '</div></div>'; }

  // ---------- page ----------
  function render() {
    $('#app').innerHTML =
      '<header><div class="logo">' + BOLT + '</div><div><h1>' + esc(CFG.title) + '</h1><div class="sub" id="sub"></div></div><button class="me" id="me">' + esc(NAME) + '</button><button class="out" id="out" aria-label="' + L('Leave the PartyBox', 'Esci dal PartyBox') + '">' + EXIT + '</button></header>' +
      '<section class="now" id="now"><div class="idle">' + L('Connecting…', 'Collegamento…') + '</div></section>' +
      '<div class="mine" id="mine"></div>' +
      '<div class="search"><label class="sbox">' + SEARCH + '<input id="q" type="search" placeholder="' + L('Search a track, an artist, an album', 'Cerca un brano, un artista, un album') + '" autocomplete="off"></label>' +
      '<div class="tabs"><button class="tab on" data-v="next">' + L('Up next', 'Prossimi') + '</button><button class="tab" data-v="albums">' + L('Albums', 'Album') + '</button></div></div>' +
      '<div id="main"></div>';
    $('#me').onclick = function () { gate(); };
    $('#out').onclick = askLeave;
    var to = 0;
    $('#q').addEventListener('input', function (e) {
      query = e.target.value.trim(); clearTimeout(to);
      if (!query) { results = null; drawMain(); return; }
      to = setTimeout(function () { var q = query; api('search?q=' + encodeURIComponent(q)).then(function (r) { if (q === query) { results = r; album = null; drawMain(); } }); }, 220);
    });
    document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { view = b.dataset.v; album = null; $('#q').value = ''; query = ''; results = null; document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); }); drawMain(); }; });
    $('#main').addEventListener('click', onMainClick);
    drawMain();
  }
  function trackRow(t, i, opts) {
    opts = opts || {};
    var req = requested[t.id];
    var btn = opts.noAdd ? '' : '<button class="add' + (req ? ' done' : '') + '" data-add="' + esc(t.id) + '" aria-label="' + L('Add to queue', 'Metti in coda') + '">' + (req ? CHECK : PLUS) + '</button>';
    var lead = opts.num ? '<div class="n">' + (i + 1) + '</div>' : '<div class="cv">' + cv(t.cover, t.album) + '</div>';
    return '<div class="row" style="animation-delay:' + Math.min(i, 14) * 25 + 'ms">' + lead + '<div class="tx"><div class="tt">' + esc(t.title) + '</div><div class="ta">' + esc(t.artist) + (t.by ? ' · ' + L('picked by', 'scelto da') + ' <b>' + esc(t.by) + '</b>' : '') + '</div></div>' + btn + '</div>';
  }
  function drawMain(quiet) {
    var m = $('#main'); if (!m) return;
    m.classList.toggle('quiet', !!quiet);
    if (album) {
      m.innerHTML = '<button class="back" data-back>' + BACK + L('Back', 'Indietro') + '</button><div class="ahead"><div class="cv">' + cv(album.cover, album.title) + '</div><div><h3>' + esc(album.title) + '</h3><p>' + esc(album.artist) + (album.year ? ' · ' + album.year : '') + '</p></div></div><div class="list">' + album.tracks.map(function (t, i) { return trackRow(t, i, { num: true }); }).join('') + '</div>';
      return;
    }
    if (results) {
      var h = '';
      if (results.albums.length) h += '<h2>' + L('Albums', 'Album') + '</h2><div class="grid">' + results.albums.map(albCard).join('') + '</div>';
      h += results.tracks.length ? '<h2>' + L('Tracks', 'Brani') + '</h2><div class="list">' + results.tracks.map(function (t, i) { return trackRow(t, i); }).join('') + '</div>' : (results.albums.length ? '' : '<div class="empty">' + L('<b>No luck 😕</b>Try another title or artist.', '<b>Niente da fare 😕</b>Prova con un altro titolo o artista.') + '</div>');
      m.innerHTML = h; return;
    }
    if (view === 'albums') {
      if (!albums) { m.innerHTML = '<div class="empty">' + L('Loading albums…', 'Carico gli album…') + '</div>'; api('albums').then(function (r) { albums = r.albums; drawMain(); }); return; }
      m.innerHTML = '<div class="grid">' + albums.map(albCard).join('') + '</div>'; return;
    }
    var nx = st && st.next || [];
    m.innerHTML = nx.length ? '<h2>' + L('Up next', 'Prossimi brani') + '</h2><div class="list">' + nx.map(function (t, i) { return trackRow(t, i, { noAdd: true }); }).join('') + '</div>'
      : '<div class="empty">' + L('<b>The queue is empty</b>Search for a track above and queue it!', '<b>La coda è vuota</b>Cerca un brano qui sopra e mettilo in coda!') + '</div>';
  }
  function albCard(a, i) { return '<button class="alb" data-album="' + esc(a.key) + '" style="animation-delay:' + Math.min(i || 0, 12) * 30 + 'ms"><div class="cv">' + cv(a.cover, a.title) + '</div><div class="tt">' + esc(a.title) + '</div><div class="ta">' + esc(a.artist) + '</div></button>'; }
  function onMainClick(e) {
    var b = e.target.closest('[data-add]');
    if (b) {
      if (b.classList.contains('done')) { toast(L('You already requested this track', 'Hai già chiesto questo brano')); return; }
      b.classList.add('wait');
      api('request', { c: C, name: NAME, id: b.dataset.add }).then(function (r) {
        b.classList.remove('wait');
        if (r.kicked) { kicked(); return; }
        if (!r.ok) { toast(r.message || L('That didn\'t work', 'Non è stato possibile')); return; }
        requested[b.dataset.add] = 1;
        b.classList.add('done'); b.innerHTML = CHECK;
        if (navigator.vibrate) navigator.vibrate(18);
        toast(r.message, true);
        poll();
      }).catch(function () { b.classList.remove('wait'); toast(L('Connection lost: are you still on the same network?', 'Connessione persa: sei ancora sulla stessa rete?')); });
      return;
    }
    var a = e.target.closest('[data-album]');
    if (a) { api('album?key=' + encodeURIComponent(a.dataset.album)).then(function (r) { album = r; drawMain(); scrollTo({ top: $('#main').offsetTop - 120, behavior: 'smooth' }); }); return; }
    if (e.target.closest('[data-back]')) { album = null; drawMain(); }
  }
  function drawState() {
    if (!st) return;
    if (st.kicked) { kicked(); return; }
    document.title = st.name;
    $('#sub').textContent = (st.mode === 'free' ? L('Open queue', 'Coda libera') : L('Approved by ', 'Con approvazione di ') + (st.host || L('the person in charge of the music', 'chi gestisce la musica'))) + ' · ' + st.guests + (st.guests === 1 ? L(' guest', ' ospite') : L(' guests', ' ospiti'));
    var n = st.now, box = $('#now');
    if (!n) { box.innerHTML = '<div class="idle">' + L('Nothing is playing yet: pick the first track! 🎶', 'Per ora non suona niente: scegli tu il primo brano! 🎶') + '</div>'; curKey = ''; }
    else {
      if (curKey !== n.id) {
        curKey = n.id;
        box.innerHTML = '<div class="cv swap">' + cv(n.cover ? n.cover : '', n.album) + '</div><div class="info"><div class="lbl"><span class="eq"><i></i><i></i><i></i></span>' + L('Now playing', 'Sta suonando') + '</div><div class="tt">' + esc(n.title) + '</div><div class="ta">' + esc(n.artist) + '</div>' + (n.by ? '<div class="by"><i>' + esc(n.by.slice(0, 1).toUpperCase()) + '</i>' + L('Picked by ', 'Scelto da ') + esc(n.by) + '</div>' : '') + '<div class="bar"><b id="pb"></b></div></div>';
        if (n.cover) { var img = $('#bgimg'); img.classList.remove('in'); var u = coverUrl(n.cover, 'l'); var pre = new Image(); pre.onload = function () { img.src = u; img.classList.add('in'); }; pre.src = u; }
        if (n.by && n.by === NAME) { toast(L('Your track is playing! 🎉', 'Sta suonando il tuo brano! 🎉'), true); confetti(); }
      }
      box.classList.toggle('paused', !n.playing);
    }
    drawMine();
    st.mine.forEach(function (r) { if (r.status === 'pending' || r.status === 'queued' || r.status === 'playing') requested[r.id] = 1; else delete requested[r.id]; });
    var sig = (st.next || []).map(function (t) { return t.id + '|' + t.by; }).join(',');
    if (!results && !album && view === 'next' && sig !== nextSig) { nextSig = sig; drawMain(true); }
  }
  var nextSig = null;
  // “Your requests”: each chip stays in place; only the state changes, and only new requests animate in
  function drawMine() {
    var box = $('#mine'); if (!box) return;
    var seen = {}, fresh = {};
    st.mine.slice().reverse().forEach(function (r) {
      seen[r.rid] = 1;
      var el = box.querySelector('[data-rid="' + r.rid + '"]');
      if (!el) {
        el = document.createElement('div');
        el.dataset.rid = r.rid;
        el.className = 'chip new'; fresh[r.rid] = 1;
        el.innerHTML = (r.cover ? '<img src="' + coverUrl(r.cover) + '" alt="">' : '<div class="ph" style="' + ph(r.album) + '"></div>') + '<span>' + esc(r.title) + '</span><em></em>';
        box.insertBefore(el, box.firstChild);
      }
      var cls = 'chip s-' + r.status + (fresh[r.rid] ? ' new' : '');
      if (el.className !== cls) el.className = cls;
      var em = el.querySelector('em'); if (em.textContent !== ST[r.status]) em.textContent = ST[r.status];
    });
    Array.prototype.slice.call(box.children).forEach(function (c) { if (!seen[c.dataset.rid]) c.remove(); });
  }
  var pt = 0;
  function poll() {
    clearTimeout(pt);
    api('state').then(function (r) { st = r; at = performance.now(); drawState(); }).catch(function () {}).then(function () { pt = setTimeout(poll, 2500); });
  }
  (function tick() {
    requestAnimationFrame(tick);
    var b = document.getElementById('pb');
    if (!b || !st || !st.now || !st.now.dur) return;
    var p = st.now.pos + (st.now.playing ? (performance.now() - at) / 1000 : 0);
    b.style.transform = 'scaleX(' + Math.min(1, p / st.now.dur) + ')';
  })();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });

  if (store.get(LEFT_KEY) === K) left(); else if (NAME) hello(); else { render(); gate(); }
})();
</script>
</body>
</html>
